<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ATOM | Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">

    <style>
        /* No intro animation on this page, so show content immediately */
        .main-canvas { animation-delay: 0s !important; }

        .auth-section { display: flex; justify-content: center; align-items: center; min-height: 80vh; padding: 20px; }
        .auth-glass-panel { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.5); padding: 40px; border-radius: 24px; width: 100%; max-width: 400px; box-shadow: 0 15px 35px rgba(0,0,0,0.05); margin: 40px auto; }
        .auth-toggle-container { position: relative; display: flex; background: rgba(0, 0, 0, 0.05); border-radius: 30px; padding: 5px; margin-bottom: 30px; }
        .toggle-slider { position: absolute; top: 5px; left: 5px; width: calc(50% - 5px); height: calc(100% - 10px); background: #FF5A1F; border-radius: 30px; transition: transform 0.3s cubic-bezier(0.25, 1, 0.5, 1); z-index: 0; }
        .toggle-btn { flex: 1; background: transparent; border: none; padding: 12px 0; font-family: 'Inter', sans-serif; font-weight: 600; color: #555; cursor: pointer; position: relative; z-index: 1; transition: color 0.3s ease; }
        .toggle-btn.active { color: #fff; }

        .input-group { margin-bottom: 16px; }
        .input-group label { display: block; font-weight: 600; font-size: 0.9rem; margin-bottom: 6px; color: #111; }
        .pw-wrap { position: relative; display: flex; align-items: center; }
        .pw-wrap .glass-input { padding-right: 48px; }
        .pw-eye { position: absolute; right: 6px; width: 40px; height: 40px; background: none; border: none; cursor: pointer; font-size: 1.1rem; display: flex; align-items: center; justify-content: center; }

        .phone-row { display: flex; gap: 8px; }
        .phone-row select.glass-input { width: 104px; flex-shrink: 0; padding-left: 10px; padding-right: 6px; }
        .phone-row input.glass-input { flex: 1; min-width: 0; }
        .pw-hint { font-size: 0.8rem; margin-top: 6px; min-height: 1em; font-weight: 600; }
        .pw-hint.ok { color: #1a9d4a; }
        .pw-hint.bad { color: #d4420c; }
        .otp-note { font-size: 0.9rem; color: #555; line-height: 1.5; margin-bottom: 16px; word-break: break-word; }
        .otp-input { text-align: center; font-size: 1.6rem; font-weight: 700; letter-spacing: 0.5em; text-indent: 0.5em; }
        .otp-actions { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-top: 14px; flex-wrap: wrap; }
        .link-btn { background: none; border: none; color: #FF5A1F; font-weight: 600; font-size: 0.9rem; cursor: pointer; padding: 8px 0; font-family: 'Inter', sans-serif; }
        .link-btn:disabled { color: #999; cursor: not-allowed; }

        @media (max-width: 480px) {
            .auth-section { padding: 10px; min-height: auto; }
            .auth-glass-panel { padding: 28px 20px; margin: 20px auto; }
            .glass-input { font-size: 16px; } /* stops iPhone auto-zoom on focus */
            #toastContainer { left: 12px !important; right: 12px !important; top: 12px !important; }
        }
    </style>
</head>
<body>
    <div class="ambient-blob-1"></div>
    <div class="ambient-blob-2"></div>

    <div id="toastContainer" style="position: fixed; top: 24px; right: 24px; z-index: 9999; display: flex; flex-direction: column; gap: 10px;"></div>

    <div class="main-canvas">
        <header class="glass-header">
            <a href="index.html" class="atom-logo-btn" style="text-decoration: none;">ATOM<span class="atom-logo-dot"></span></a>
            <nav class="nav-links" id="navLinks">
                <a href="index.html">Home</a>
                <a href="pricing.html">Pricing</a>
                <a href="contact.html">Contact</a>
                <a href="login.html" class="active">Login</a>
                <a href="dashboard.html">Dashboard</a>
            </nav>
            <button class="mobile-menu-toggle" type="button" aria-label="Open menu" onclick="toggleMenu()">
                <span></span><span></span><span></span>
            </button>
        </header>

        <section class="auth-section">
            <div class="auth-glass-panel">

                <div class="auth-toggle-container">
                    <div class="toggle-slider" id="toggleSlider"></div>
                    <button type="button" class="toggle-btn active" id="toggleLogin" onclick="switchAuth('login')">Login</button>
                    <button type="button" class="toggle-btn" id="toggleSignup" onclick="switchAuth('signup')">Sign Up</button>
                </div>

                <!-- LOGIN FORM -->
                <form id="loginForm" class="glass-form active-form" onsubmit="handleLogin(event)">
                    <div class="input-group">
                        <label for="loginEmail">Email Address</label>
                        <input type="email" id="loginEmail" class="glass-input" required placeholder="manager@cafe.com" autocomplete="email">
                    </div>

                    <div class="input-group">
                        <label for="loginPassword">Password</label>
                        <div class="pw-wrap">
                            <input type="password" id="loginPassword" class="glass-input" required placeholder="••••••••" autocomplete="current-password">
                            <button type="button" class="pw-eye" onclick="togglePasswordVisibility('loginPassword', this)" aria-label="Show password">👁️</button>
                        </div>
                    </div>

                    <div style="text-align: right; margin-bottom: 15px;">
                        <a href="#" onclick="triggerForgotPassword(event)" style="color: #FF5A1F; font-size: 0.85rem; text-decoration: none; font-weight: 600;">Forgot Password?</a>
                    </div>

                    <button type="submit" class="btn-primary-action" style="margin-top: 5px; width: 100%; border: none; cursor: pointer;">Access Dashboard</button>
                </form>

                <!-- SIGNUP FORM - STEP 1: DETAILS -->
                <form id="signupForm" class="glass-form hidden-form" style="display: none;" onsubmit="handleSignup(event)">
                    <div class="input-group">
                        <label for="signupName">Full Name</label>
                        <input type="text" id="signupName" class="glass-input" required autocomplete="name">
                    </div>
                    <div class="input-group">
                        <label for="signupEmail">Email Address</label>
                        <input type="email" id="signupEmail" class="glass-input" required autocomplete="email" placeholder="you@example.com">
                    </div>
                    <div class="input-group">
                        <label for="signupPhone">Phone Number</label>
                        <div class="phone-row">
                            <select id="signupPhoneCode" class="glass-input" aria-label="Country code">
                                <option value="+91">🇮🇳 +91</option>
                                <option value="+1">🇺🇸 +1</option>
                                <option value="+44">🇬🇧 +44</option>
                            </select>
                            <input type="tel" id="signupPhone" class="glass-input" required inputmode="numeric" maxlength="15" placeholder="98765 43210" autocomplete="tel-national">
                        </div>
                    </div>
                    <div class="input-group">
                        <label for="signupPassword">Create Password</label>
                        <div class="pw-wrap">
                            <input type="password" id="signupPassword" class="glass-input" required minlength="6" placeholder="At least 6 characters" autocomplete="new-password" oninput="checkPasswordMatch()">
                            <button type="button" class="pw-eye" onclick="togglePasswordVisibility('signupPassword', this)" aria-label="Show password">👁️</button>
                        </div>
                    </div>
                    <div class="input-group">
                        <label for="signupConfirm">Confirm Password</label>
                        <div class="pw-wrap">
                            <input type="password" id="signupConfirm" class="glass-input" required minlength="6" placeholder="Re-enter password" autocomplete="new-password" oninput="checkPasswordMatch()">
                            <button type="button" class="pw-eye" onclick="togglePasswordVisibility('signupConfirm', this)" aria-label="Show password">👁️</button>
                        </div>
                        <div id="pwMatchHint" class="pw-hint"></div>
                    </div>
                    <button type="submit" id="signupBtn" class="btn-primary-action" style="margin-top: 10px; width: 100%; border: none; cursor: pointer;">Send Verification Code</button>
                </form>

                <!-- SIGNUP FORM - STEP 2: EMAIL OTP -->
                <form id="signupOtpForm" class="glass-form" style="display: none;" onsubmit="handleVerifyOtp(event)">
                    <p class="otp-note">We sent a 6-digit code to <strong id="signupOtpEmail"></strong>. Enter it below to create your account. If you don't see it, check your spam folder.</p>
                    <div class="input-group">
                        <label for="signupOtp">Verification Code</label>
                        <input type="text" id="signupOtp" class="glass-input otp-input" required inputmode="numeric" maxlength="6" pattern="[0-9]{6}" placeholder="••••••" autocomplete="one-time-code">
                    </div>
                    <button type="submit" id="verifyOtpBtn" class="btn-primary-action" style="margin-top: 5px; width: 100%; border: none; cursor: pointer;">Verify &amp; Create Account</button>
                    <div class="otp-actions">
                        <button type="button" id="resendOtpBtn" class="link-btn" onclick="resendSignupOtp()" disabled>Resend code</button>
                        <button type="button" class="link-btn" onclick="backToSignupDetails()">← Change details</button>
                    </div>
                </form>

            </div>
        </section>
    </div>

    <script src="script.js"></script>
</body>
</html>

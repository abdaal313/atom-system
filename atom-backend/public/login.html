<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ATOM | Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    
    <style>
        .auth-section { display: flex; justify-content: center; align-items: center; min-height: 80vh; padding: 20px; }
        .auth-glass-panel { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.5); padding: 40px; border-radius: 24px; width: 100%; max-width: 400px; box-shadow: 0 15px 35px rgba(0,0,0,0.05); margin: 40px auto; }
        .auth-toggle-container { position: relative; display: flex; background: rgba(0, 0, 0, 0.05); border-radius: 30px; padding: 5px; margin-bottom: 30px; }
        .toggle-slider { position: absolute; top: 5px; left: 5px; width: calc(50% - 5px); height: calc(100% - 10px); background: #FF5A1F; border-radius: 30px; transition: transform 0.3s cubic-bezier(0.25, 1, 0.5, 1); z-index: 0; }
        .toggle-btn { flex: 1; background: transparent; border: none; padding: 12px 0; font-family: 'Inter', sans-serif; font-weight: 600; color: #555; cursor: pointer; position: relative; z-index: 1; transition: color 0.3s ease; }
        .toggle-btn.active { color: #fff; }
    </style>
</head>
<body>
    <div class="ambient-blob-1"></div>
    <div class="ambient-blob-2"></div>

    <div id="toastContainer" style="position: fixed; top: 24px; right: 24px; z-index: 9999; display: flex; flex-direction: column; gap: 10px;"></div>

    <div class="main-canvas">
        <header class="glass-header">
            <a href="index.html" class="atom-logo-btn" style="text-decoration: none;">ATOM<span class="atom-logo-dot"></span></a>
            <nav class="nav-links" id="navLinks">
                <a href="index.html">Home</a>
                <a href="pricing.html">Pricing</a>
                <a href="contact.html">Contact</a>
                <a href="login.html" class="active">Login</a>
                <a href="dashboard.html">Dashboard</a>
            </nav>
            <button class="mobile-menu-toggle" onclick="toggleMenu()">
                <span></span><span></span><span></span>
            </button>
        </header>

        <section class="auth-section">
            <div class="auth-glass-panel">
                
                <div class="auth-toggle-container">
                    <div class="toggle-slider" id="toggleSlider"></div>
                    <button class="toggle-btn active" id="toggleLogin" onclick="switchAuth('login')">Login</button>
                    <button class="toggle-btn" id="toggleSignup" onclick="switchAuth('signup')">Sign Up</button>
                </div>

                <!-- LOGIN FORM -->
                <form id="loginForm" class="glass-form active-form" onsubmit="handleLogin(event)">
                    <div class="input-group">
                        <label>Email Address</label>
                        <input type="email" id="loginEmail" class="glass-input" required placeholder="manager@cafe.com">
                    </div>
                    
                    <div class="input-group" style="position: relative;">
                        <label>Password</label>
                        <div style="position: relative; display: flex; align-items: center;">
                            <input type="password" id="loginPassword" class="glass-input" required placeholder="••••••••" style="width: 100%; padding-right: 45px;">
                            <button type="button" onclick="togglePasswordVisibility('loginPassword', this)" style="position: absolute; right: 12px; background: none; border: none; cursor: pointer; font-size: 1.1rem;" title="Show/Hide Password">👁️</button>
                        </div>
                    </div>

                    <div style="text-align: right; margin-bottom: 15px;">
                        <a href="#" onclick="triggerForgotPassword(event)" style="color: #FF5A1F; font-size: 0.85rem; text-decoration: none; font-weight: 600;">Forgot Password?</a>
                    </div>

                    <button type="submit" class="btn-primary-action" style="margin-top: 5px; width: 100%;">Access Dashboard</button>
                </form>

                <!-- SIGNUP FORM -->
                <form id="signupForm" class="glass-form hidden-form" style="display: none;" onsubmit="handleSignup(event)">
                    <div class="input-group">
                        <label>Full Name</label>
                        <input type="text" id="signupName" class="glass-input" required placeholder="">
                    </div>
                    <div class="input-group">
                        <label>Email Address</label>
                        <input type="email" id="signupEmail" class="glass-input" required placeholder="">
                    </div>
                    <div class="input-group">
                        <label>Create Password</label>
                        <input type="password" id="signupPassword" class="glass-input" required placeholder="••••••••">
                    </div>
                    <button type="submit" id="signupBtn" class="btn-primary-action" style="margin-top: 10px; width: 100%;">Create Account</button>
                </form>
                
            </div>
        </section>
    </div>

    <script src="script.js"></script>
</body>
</html>

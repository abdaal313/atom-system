<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Live Menu | ATOM</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body style="background: #FDFBF7; padding-bottom: 50px;">
    <div id="toastContainer" style="position: fixed; top: 20px; right: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 10px;"></div>

    <div style="max-width: 600px; margin: 0 auto; padding: 20px;">
        
        <!-- Header Section -->
        <div style="text-align: center; margin-bottom: 30px;">
            <h1 id="publicCafeName" style="font-family: 'Space Grotesk', sans-serif; font-size: 2.2rem; color: #111; margin: 0;">Welcome</h1>
            <div id="publicTableBadge" style="display: inline-block; background: #FF5A1F; color: #fff; font-weight: 800; padding: 6px 16px; border-radius: 20px; margin-top: 10px;">Table --</div>
        </div>

        <!-- Menu Items List -->
        <div id="customerMenuGrid" style="display: flex; flex-direction: column; gap: 15px;">
            <div style="text-align:center; color: #888; font-weight: 600; padding: 40px;">Loading live menu...</div>
        </div>

        <!-- Inline Cart & Checkout Section -->
        <div id="customerCartSection" style="display: none; margin-top: 40px; background: #fff; border: 1px solid #eee; border-radius: 24px; padding: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.05);">
            <h3 style="font-family: 'Space Grotesk', sans-serif; font-size: 1.4rem; color: #111; border-bottom: 1px solid #eee; padding-bottom: 10px; margin-bottom: 15px;">🛒 Your Order</h3>
            
            <div id="cartSummaryList" style="margin-bottom: 15px;"></div>
            
            <div style="display: flex; justify-content: space-between; font-weight: 800; font-size: 1.2rem; color: #FF5A1F; margin-bottom: 25px;">
                <span>Total:</span>
                <span id="cartTotalAmt">₹0</span>
            </div>

            <h3 style="font-family: 'Space Grotesk', sans-serif; font-size: 1.1rem; color: #111; margin-bottom: 10px;">💳 Payment Method</h3>
            <div style="display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px;">
                <label style="display: flex; align-items: center; gap: 10px; background: #f9f9f9; padding: 12px; border-radius: 12px; cursor: pointer; border: 1px solid #eee;">
                    <input type="radio" name="payMethod" value="desk" checked onchange="toggleUpiView()"> 💵 Pay at Desk
                </label>
                <label style="display: flex; align-items: center; gap: 10px; background: #f9f9f9; padding: 12px; border-radius: 12px; cursor: pointer; border: 1px solid #eee;">
                    <input type="radio" name="payMethod" value="upi" onchange="toggleUpiView()"> 📱 Pay via UPI
                </label>
            </div>

            <div id="upiDetailsBox" style="display: none; text-align: center; background: rgba(37, 211, 102, 0.1); padding: 15px; border-radius: 12px; border: 1px solid rgba(37, 211, 102, 0.3); margin-bottom: 20px;">
                <img id="publicUpiQr" src="" style="width: 150px; height: 150px; border-radius: 8px; display: none; margin: 0 auto 10px auto;">
                <p style="font-weight: 800; color: #1A4D2E;" id="publicUpiId"></p>
                <p style="font-size: 0.8rem; color: #2E8B57; margin-top: 5px;">Scan QR or copy UPI ID to pay. Then confirm order.</p>
            </div>

            <button style="width: 100%; background: #FF5A1F; color: #fff; border: none; padding: 16px; border-radius: 14px; font-weight: 800; font-size: 1.1rem; cursor: pointer; box-shadow: 0 4px 15px rgba(255, 90, 31, 0.3);" onclick="submitCustomerOrder()">Confirm & Send to Kitchen ➔</button>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>

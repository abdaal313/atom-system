<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ATOM | Master Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- SECURITY GUARD: Instantly blocks unauthorized direct URL access -->
    <script>
        if (!localStorage.getItem('atom_token')) {
            window.location.href = 'login.html';
        }
    </script>

    <style>
        /* UPGRADE: Night Mode Variables */
        body.dark-mode { background: #121212; color: #fff; }
        body.dark-mode .dash-header-huge h1 { color: #fff; }
        body.dark-mode .dash-panel { background: rgba(30, 30, 30, 0.8); border: 1px solid rgba(255,255,255,0.1); }
        body.dark-mode .card-item { background: #222; border: 1px solid #333; color: #fff; }
        body.dark-mode input, body.dark-mode select { background: #333; color: #fff; border: 1px solid #555; }
        
        .dash-header-huge { text-align: center; margin: 40px 0; position: relative; }
        .dash-header-huge h1 { font-family: 'Space Grotesk', sans-serif; font-size: 4rem; margin: 0; letter-spacing: -2px; color: #111; }
        .dash-header-huge p { font-family: 'Space Grotesk', sans-serif; color: #FF5A1F; font-size: 1.2rem; font-weight: 700; text-transform: uppercase; margin-top: -5px; }
        
        .night-mode-btn { position: absolute; right: 0; top: 20px; background: #333; color: #fff; border: none; padding: 10px 15px; border-radius: 8px; cursor: pointer; font-weight: bold; }
        
        .dash-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 24px; padding: 20px; max-width: 1400px; margin: 0 auto; }
        .dash-panel { background: rgba(255,255,255,0.7); backdrop-filter: blur(12px); border-radius: 20px; padding: 24px; border: 1px solid rgba(255,255,255,0.5); box-shadow: 0 10px 30px rgba(0,0,0,0.03); transition: all 0.3s ease; }
        
        .dynamic-list { display: flex; flex-direction: column; gap: 12px; max-height: 400px; overflow-y: auto; padding-right: 5px;}
        .card-item { display: flex; align-items: center; justify-content: space-between; background: #fff; padding: 12px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.02); }
        .card-info { display: flex; align-items: center; gap: 15px; }
        .card-img { width: 50px; height: 50px; border-radius: 8px; object-fit: cover; background: #eee; }
        
        .stock-toggle { appearance: none; width: 40px; height: 20px; background: #ccc; border-radius: 20px; position: relative; cursor: pointer; outline: none; transition: 0.3s; margin-right: 10px; }
        .stock-toggle:checked { background: #25D366; }
        .stock-toggle::before { content: ''; position: absolute; width: 16px; height: 16px; border-radius: 50%; top: 2px; left: 2px; background: #fff; transition: 0.3s; }
        .stock-toggle:checked::before { transform: translateX(20px); }
        
        .btn-delete { background: #fee2e2; color: #ef4444; border: none; padding: 8px 12px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .btn-logout { background: #111; color: #fff; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: 600; text-decoration: none; }
        .btn-logout:hover { background: #ef4444; }
        
        .btn-add-inline { width: 100%; margin-top: 15px; background: #111; color: #fff; padding: 12px; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; }
        .form-row-mini { display: flex; gap: 10px; margin-top: 10px; flex-direction: column; }
        .form-row-mini input, .form-row-mini select { padding: 10px; border: 1px solid #ddd; border-radius: 6px; font-family: 'Inter'; }
    </style>
</head>
<body>
    <div id="toastContainer" style="position: fixed; top: 24px; right: 24px; z-index: 9999; display: flex; flex-direction: column; gap: 10px;"></div>

    <div class="main-canvas" style="padding-bottom: 100px;">
        <header class="glass-header" style="justify-content: flex-end; gap: 12px; align-items: center; padding: 20px 40px;">
            <a href="index.html" class="btn-secondary-action" style="text-decoration: none; padding: 10px 20px;">🏠 Landing</a>
            <a href="qr-generator.html" class="btn-primary-action" style="text-decoration: none; padding: 10px 20px;">QR Generator</a>
            <button onclick="handleLogout()" class="btn-logout">🔒 Logout</button>
        </header>

        <div class="dash-header-huge">
            <h1>ATOM</h1>
            <p>Creating Ease</p>
            <button class="night-mode-btn" onclick="toggleNightMode()">🌙 Night Shift</button>
        </div>

        <div class="dash-grid">
            <div class="dash-panel" style="grid-column: 1 / -1;">
                <h3>Cafe Analytics</h3>
                <div style="height: 300px; width: 100%;"><canvas id="salesChart"></canvas></div>
            </div>

            <!-- SHOPS -->
            <div class="dash-panel">
                <h3>🏬 Connected Shops</h3>
                <div class="dynamic-list" id="shopsList"></div>
                <div class="form-row-mini">
                    <input type="text" id="newShopName" placeholder="Shop Name">
                    <input type="text" id="newShopPhoto" placeholder="Photo URL (Optional)">
                    <button class="btn-add-inline" onclick="addShop()">+ Add Shop</button>
                </div>
            </div>

            <!-- DIGITAL MENU -->
            <div class="dash-panel">
                <h3>🍔 Digital Menu</h3>
                <div class="dynamic-list" id="productsList"></div>
                <div class="form-row-mini">
                    <input type="text" id="newProductName" placeholder="Item Name">
                    <input type="number" id="newProductPrice" placeholder="Price (₹)">
                    <select id="newProductCategory">
                        <option value="Beverages">Beverages</option>
                        <option value="Mains">Mains</option>
                        <option value="Desserts">Desserts</option>
                    </select>
                    <input type="text" id="newProductPhoto" placeholder="Photo URL (Optional)">
                    <button class="btn-add-inline" onclick="addProduct()">+ Add Product</button>
                </div>
            </div>

            <!-- EMPLOYEES -->
            <div class="dash-panel">
                <h3>👥 Staff Roster</h3>
                <div class="dynamic-list" id="employeesList"></div>
                <div class="form-row-mini">
                    <input type="text" id="newEmpName" placeholder="Employee Name">
                    <input type="text" id="newEmpRole" placeholder="Role (e.g. Barista)">
                    <button class="btn-add-inline" onclick="addEmployee()">+ Add Staff</button>
                </div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>

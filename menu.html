<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ATOM | Digital Menu & Direct Pay</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .menu-header-flex { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
        .table-badge { background: #FF5A1F; color: #fff; padding: 6px 16px; border-radius: 20px; font-weight: bold; font-family: 'Space Grotesk', sans-serif; font-size: 0.9rem; box-shadow: 0 4px 12px rgba(255,90,31,0.3); }
        
        .menu-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; padding-bottom: 120px; }
        .menu-card { background: rgba(255,255,255,0.7); backdrop-filter: blur(12px); border-radius: 16px; padding: 16px; border: 1px solid rgba(255,255,255,0.6); box-shadow: 0 10px 30px rgba(0,0,0,0.03); display: flex; flex-direction: column; justify-content: space-between; }
        .menu-card img { width: 100%; height: 160px; object-fit: cover; border-radius: 12px; margin-bottom: 12px; background: #eee; }
        .menu-details h4 { margin: 0 0 5px 0; font-size: 1.1rem; color: #111; font-family: 'Space Grotesk', sans-serif; }
        .menu-action-row { display: flex; justify-content: space-between; align-items: center; margin-top: 15px; }
        .menu-price { font-weight: 700; font-size: 1.1rem; color: #111; }
        .btn-add { background: #111; color: #fff; border: none; padding: 8px 16px; border-radius: 8px; cursor: pointer; font-weight: 600; transition: background 0.2s; }
        .btn-add:hover { background: #FF5A1F; }

        /* Floating Cart & Direct UPI Checkout Bar */
        .floating-cart { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(100px); background: #111; color: #fff; padding: 16px 24px; border-radius: 30px; display: flex; align-items: center; justify-content: space-between; width: 90%; max-width: 600px; box-shadow: 0 15px 35px rgba(0,0,0,0.3); transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); z-index: 9999; }
        .floating-cart.visible { transform: translateX(-50%) translateY(0); }
        .cart-info { display: flex; gap: 15px; align-items: center; font-family: 'Space Grotesk', sans-serif; }
        .btn-upi-pay { background: #25D366; color: #fff; border: none; padding: 10px 20px; border-radius: 20px; font-weight: bold; cursor: pointer; font-family: 'Inter', sans-serif; font-size: 0.9rem; }
    </style>
</head>
<body>
    <div class="ambient-blob-1"></div>
    <div class="ambient-blob-2"></div>

    <div id="toastContainer" style="position: fixed; top: 24px; right: 24px; z-index: 9999; display: flex; flex-direction: column; gap: 10px;"></div>

    <div class="main-canvas" style="padding: 20px;">
        <header class="glass-header" style="margin-bottom: 20px;">
            <a href="index.html" class="atom-logo-btn" style="text-decoration: none;">
                ATOM<span class="atom-logo-dot"></span>
            </a>
        </header>

        <div class="menu-header-flex">
            <div>
                <h2 id="menuCafeTitle" style="font-family: 'Space Grotesk', sans-serif; font-size: 2rem; margin: 0;">Loading Cafe...</h2>
                <p style="color: #666; margin: 5px 0 0 0; font-size: 0.9rem;">Browse our fresh digital menu and order instantly.</p>
            </div>
            <div class="table-badge" id="displayTableBadge">TABLE --</div>
        </div>

        <!-- Rendered Menu Items Dynamically Grouped by Category -->
        <div id="menu-container">
            <p style="text-align: center; color: #889; padding: 40px;">Fetching menu items...</p>
        </div>
    </div>

    <!-- Floating Table-Wise Checkout & UPI Payment Bar -->
    <div class="floating-cart" id="floatingCart">
        <div class="cart-info">
            <span id="cartCount">0 Items</span>
            <span>•</span>
            <span id="cartTotal" style="color: #25D366;">₹0</span>
        </div>
        <button class="btn-upi-pay" onclick="triggerUPICheckout()">⚡ Pay via UPI</button>
    </div>

    <script src="script.js"></script>
    <script>
        // Initialize menu extraction and URL parameter parsing on page load
        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const tableNo = urlParams.get('table') || '01';
            
            // Display dynamic table badge
            document.getElementById('displayTableBadge').innerText = `TABLE ${tableNo.toUpperCase()}`;
            
            // Trigger core public menu loader
            fetchMenuFromDatabase();
        });

        // UPI Checkout Dispatcher
        function triggerUPICheckout() {
            const urlParams = new URLSearchParams(window.location.search);
            const upiId = urlParams.get('upi') || 'merchant@upi';
            const tableNo = urlParams.get('table') || '01';
            const totalAmount = cart.reduce((s, i) => s + Number(i.price), 0);

            if(totalAmount <= 0) return alert("Your cart is empty!");

            // Generate standard UPI payment URI string
            const upiLink = `upi://pay?pa=${encodeURIComponent(upiId)}&pn=ATOM%20Cafe%20Order&am=${totalAmount}&cu=INR&tn=Table%20${tableNo}%20Order`;
            
            // Open mobile UPI app or display fallback intent
            window.location.href = upiLink;
            setTimeout(() => {
                alert(`Order placed successfully for Table ${tableNo}!\nTotal: ₹${totalAmount}\nRouted to UPI ID: ${upiId}`);
            }, 500);
        }
    </script>
</body>
</html>

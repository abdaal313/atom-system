<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ATOM | Reset Password</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="ambient-blob-1"></div>
    <div class="ambient-blob-2"></div>
    <div id="toastContainer" style="position: fixed; top: 24px; right: 24px; z-index: 9999; display: flex; flex-direction: column; gap: 10px;"></div>

    <div class="main-canvas" style="display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px;">
        <div class="qr-glass-panel" style="width: 100%; max-width: 400px; padding: 40px; background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(12px); border-radius: 24px; border: 1px solid rgba(255,255,255,0.5); box-shadow: 0 15px 35px rgba(0,0,0,0.05);">
            <h2 style="font-family: 'Space Grotesk', sans-serif; margin-top: 0; color: #111;">Set New Password</h2>
            <p style="color: #666; font-size: 0.9rem; margin-bottom: 25px;">Enter your new secure password below to regain access to your workspace.</p>
            
            <form onsubmit="handlePasswordReset(event)">
                <div class="input-group" style="margin-bottom: 20px; position: relative;">
                    <label style="display: block; font-weight: 600; margin-bottom: 8px; font-size: 0.9rem; color: #111;">New Password</label>
                    <div style="position: relative; display: flex; align-items: center;">
                        <input type="password" id="newPassword" class="glass-input" required placeholder="••••••••" style="width: 100%; padding: 12px; padding-right: 45px; border: 1px solid #ddd; border-radius: 8px; font-family: 'Inter';">
                        <button type="button" onclick="togglePasswordVisibility('newPassword', this)" style="position: absolute; right: 12px; background: none; border: none; cursor: pointer; font-size: 1.1rem;" title="Show/Hide Password">👁️</button>
                    </div>
                </div>
                <button type="submit" class="btn-primary-action" style="width: 100%; padding: 14px; background: #FF5A1F; color: #fff; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 1rem;">Update Password</button>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        async function handlePasswordReset(e) {
            e.preventDefault();
            const urlParams = new URLSearchParams(window.location.search);
            const token = urlParams.get('token');
            const newPassword = document.getElementById('newPassword').value;

            if (!token) {
                window.showGlobalToast('Invalid or missing reset token.', 'error');
                return;
            }

            try {
                const res = await fetch('http://localhost:8080/api/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token, newPassword })
                });
                const data = await res.json();
                if (res.ok) {
                    window.showGlobalToast('Password successfully reset! Redirecting...', 'success');
                    setTimeout(() => { window.location.href = 'login.html'; }, 2000);
                } else {
                    window.showGlobalToast(data.error || 'Reset failed.', 'error');
                }
            } catch (err) {
                window.showGlobalToast('Network error while resetting password.', 'error');
            }
        }
    </script>
</body>
</html>
